name: Release

# Runs when a pull request is merged into main. Signs, notarizes, tags and
# publishes a GitHub release with generated notes. Secrets live in the
# "release" environment; add required reviewers there for a manual gate.
on:
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - ".github/release.yml"

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-26
    timeout-minutes: 60
    environment: release
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-go@v7
        with:
          go-version-file: Vendor/jamf-cli/go.mod
          cache: false

      - name: Regression tests
        run: |
          for t in Tests/*.py; do python3 -I "$t"; done

      - name: Work out the version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git fetch --tags --force
          latest="$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -1)"
          if [[ -z "$latest" ]]; then
            next="$(sed -n 's/^VERSION="${APP_VERSION:-\(.*\)}"$/\1/p' build.sh)"
            [[ -n "$next" ]] || { echo "No tag and no default version in build.sh"; exit 1; }
          else
            IFS=. read -r major minor patch <<<"${latest#v}"
            labels="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/pulls" --jq '.[].labels[].name' || true)"
            if grep -qx 'release:major' <<<"$labels"; then next="$((major + 1)).0.0"
            elif grep -qx 'release:minor' <<<"$labels"; then next="${major}.$((minor + 1)).0"
            else next="${major}.${minor}.$((patch + 1))"; fi
          fi
          if git rev-parse -q --verify "refs/tags/v$next" >/dev/null; then
            echo "Tag v$next already exists; nothing to release."; exit 1
          fi
          echo "version=$next" >> "$GITHUB_OUTPUT"
          echo "previous=$latest" >> "$GITHUB_OUTPUT"
          echo "Releasing v$next (previous: ${latest:-none})"

      - name: Import signing certificates
        env:
          APP_CERT_P12: ${{ secrets.BCU_APP_CERT_P12 }}
          INSTALLER_CERT_P12: ${{ secrets.BCU_INSTALLER_CERT_P12 }}
          CERT_PASSWORD: ${{ secrets.BCU_CERT_PASSWORD }}
        run: |
          set -euo pipefail
          umask 077
          KC="$RUNNER_TEMP/bcu-signing.keychain-db"
          KC_PASS="$(uuidgen)"
          echo "::add-mask::$KC_PASS"
          security create-keychain -p "$KC_PASS" "$KC"
          security set-keychain-settings -lut 3600 "$KC"
          security unlock-keychain -p "$KC_PASS" "$KC"
          security list-keychains -d user -s "$KC" login.keychain-db
          security default-keychain -d user -s "$KC"
          for name in APP INSTALLER; do
            var="${name}_CERT_P12"
            printf '%s' "${!var}" | base64 --decode > "$RUNNER_TEMP/$name.p12"
            security import "$RUNNER_TEMP/$name.p12" -k "$KC" -P "$CERT_PASSWORD" -T /usr/bin/codesign -T /usr/bin/productbuild -T /usr/bin/pkgbuild
            rm -f "$RUNNER_TEMP/$name.p12"
          done
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KC_PASS" "$KC" >/dev/null
          app_id="$(security find-identity -v "$KC" | awk '/Developer ID Application/ {print $2; exit}')"
          inst_id="$(security find-identity -v "$KC" | awk '/Developer ID Installer/ {print $2; exit}')"
          [[ -n "$app_id" && -n "$inst_id" ]] || { echo "Signing identities not found in the imported certificates"; exit 1; }
          echo "BCU_APP_SIGN_IDENTITY=$app_id" >> "$GITHUB_ENV"
          echo "BCU_INSTALLER_SIGN_IDENTITY=$inst_id" >> "$GITHUB_ENV"
          echo "BCU_SIGNING_KEYCHAIN=$KC" >> "$GITHUB_ENV"

      - name: Store notarization credentials
        env:
          NOTARY_API_KEY: ${{ secrets.BCU_NOTARY_API_KEY }}
          NOTARY_KEY_ID: ${{ secrets.BCU_NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.BCU_NOTARY_ISSUER_ID }}
        run: |
          set -euo pipefail
          umask 077
          printf '%s' "$NOTARY_API_KEY" > "$RUNNER_TEMP/notary.p8"
          xcrun notarytool store-credentials BCU-Notary \
            --key "$RUNNER_TEMP/notary.p8" --key-id "$NOTARY_KEY_ID" --issuer "$NOTARY_ISSUER_ID" \
            --keychain "$BCU_SIGNING_KEYCHAIN" --no-validate >/dev/null
          rm -f "$RUNNER_TEMP/notary.p8"
          echo "BCU_NOTARY_PROFILE=BCU-Notary" >> "$GITHUB_ENV"

      - name: Build, sign and notarize
        run: bash build.sh --version "${{ steps.version.outputs.version }}"

      - name: Verify the signed artifacts
        run: |
          set -euo pipefail
          v="${{ steps.version.outputs.version }}"
          cd dist
          codesign --verify --deep --strict "Blueprint Conversion Utility.app"
          spctl -a -vv "Blueprint Conversion Utility.app"
          xcrun stapler validate "Blueprint-Conversion-Utility-$v.dmg"
          xcrun stapler validate "Blueprint-Conversion-Utility-$v.pkg"
          pkgutil --check-signature "Blueprint-Conversion-Utility-$v.pkg"
          shasum -a 256 "Blueprint-Conversion-Utility-$v.pkg" "Blueprint-Conversion-Utility-$v.dmg" "Blueprint-Conversion-Utility-$v-Standalone-App.zip" > SHA256SUMS.txt

      - name: Tag and publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          v="${{ steps.version.outputs.version }}"
          prev="${{ steps.version.outputs.previous }}"
          args=(--title "Blueprint Conversion Utility $v" --target "$GITHUB_SHA" --generate-notes --verify-tag=false)
          [[ -n "$prev" ]] && args+=(--notes-start-tag "$prev")
          gh release create "v$v" "${args[@]}" \
            "dist/Blueprint-Conversion-Utility-$v.pkg" \
            "dist/Blueprint-Conversion-Utility-$v.dmg" \
            "dist/Blueprint-Conversion-Utility-$v-Standalone-App.zip" \
            "dist/SHA256SUMS.txt"

      - name: Remove signing material
        if: always()
        run: |
          security delete-keychain "$BCU_SIGNING_KEYCHAIN" 2>/dev/null || true
          rm -f "$RUNNER_TEMP"/*.p12 "$RUNNER_TEMP"/*.p8
